[project]
name = "docuengine-trainer"
version = "0.1.0"
description = "DocuEngine — correction-driven fine-tuning with eval gating"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docuengine-backend",
    "celery[redis]>=5.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
# LoRA fine-tuning of PaddleOCR-VL's ERNIE decoder (client-server GPU only).
# paddlenlp 3.0 is still in beta on PyPI, hence the b-release floor.
lora = ["paddlenlp>=3.0.0b0"]

[tool.uv.sources]
docuengine-backend = { path = "../backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
