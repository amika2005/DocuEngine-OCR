[project]
name = "docuengine-backend"
version = "0.1.0"
description = "DocuEngine — offline OCR document processing (API + workers)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "pymupdf>=1.24",
    "pillow>=10.3",
    "numpy>=1.26",
    "sse-starlette>=2.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# OCR stack — installed only in the worker image / on the client server.
# NOTE: paddlepaddle-gpu 3.x ships from Paddle's own wheel index, not PyPI;
# the worker Dockerfile installs it explicitly (see docker/worker install docs).
ocr = [
    "paddleocr>=3.0",
    "rapidocr>=3.9",
    # Swap for onnxruntime-directml on Windows to enable OCR_USE_GPU=true.
    "onnxruntime>=1.20",
    "img2table>=1.4",
]
# Table structure on the VPS worker (office OCR for text, img2table for grids).
# Do not pull paddleocr — that extra is for GPU/CPU local engines.
tables = [
    "opencv-python-headless>=4.8",
    "img2table>=1.4",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
